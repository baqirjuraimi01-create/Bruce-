<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eeeef0">
<title>Bruce — Training &amp; Nutrition</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <button class="daynav" id="prevDay" aria-label="Previous day">&#8249;</button>
    <div class="datewrap">
      <input type="date" id="datePicker" aria-label="Selected date">
      <div class="datemeta" id="dateMeta">—</div>
    </div>
    <button class="daynav" id="nextDay" aria-label="Next day">&#8250;</button>
  </div>
</header>

<main id="view" class="view"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="home"    class="tab active"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-6h5v6"/></svg></span><span>Home</span></button>
  <button data-tab="food"    class="tab"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 0 1-16 0Z"/><path d="M6 11c0-3 2-4 2-5.5S6.5 3.5 6.5 3.5"/><path d="M11 11c0-3 2-4 2-5.5S11.5 3.5 11.5 3.5"/><path d="M3 19h18"/></svg></span><span>Food</span></button>
  <button data-tab="train"   class="tab"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9v6M5 7v10M19 7v10M22 9v6"/><path d="M5 12h14"/></svg></span><span>Train</span></button>
  <button data-tab="cardio"  class="tab"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3-7 4 14 3-7h6"/></svg></span><span>Cardio</span></button>
  <button data-tab="progress"class="tab"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span><span>Progress</span></button>
  <button data-tab="plan"    class="tab"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span><span>Plan</span></button>
</nav>

<!-- Scanner overlay -->
<div class="overlay" id="scanOverlay" hidden>
  <div class="scan-head">
    <button class="btn ghost" id="scanClose">Close</button>
    <span id="scanStatus">Starting camera…</span>
  </div>
  <video id="scanVideo" playsinline muted></video>
  <div class="scan-reticle"></div>
  <div class="scan-foot">
    <input type="text" id="manualBarcode" inputmode="numeric" placeholder="Or type the barcode digits">
    <button class="btn" id="manualLookup">Look up</button>
  </div>
</div>

<!-- Generic modal -->
<div class="overlay sheet-overlay" id="sheet" hidden>
  <div class="sheet" id="sheetBody"></div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/nutrition.js"></script>
<script src="js/scanner.js"></script>
<script src="js/progression.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.home.js"></script>
<script src="js/views.food.js"></script>
<script src="js/views.train.js"></script>
<script src="js/views.cardio.js"></script>
<script src="js/views.progress.js"></script>
<script src="js/views.plan.js"></script>
<script src="js/app.js"></script>
</body>
</html>
