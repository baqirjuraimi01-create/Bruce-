<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Bruce — Training &amp; Nutrition</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <button class="daynav" id="prevDay" aria-label="Previous day">&#8249;</button>
    <div class="datewrap">
      <input type="date" id="datePicker" aria-label="Selected date">
      <div class="datemeta" id="dateMeta">—</div>
    </div>
    <button class="daynav" id="nextDay" aria-label="Next day">&#8250;</button>
  </div>
</header>

<main id="view" class="view"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="food"    class="tab active"><span class="ico">&#127837;</span><span>Food</span></button>
  <button data-tab="train"   class="tab"><span class="ico">&#127947;</span><span>Train</span></button>
  <button data-tab="cardio"  class="tab"><span class="ico">&#128694;</span><span>Cardio</span></button>
  <button data-tab="progress"class="tab"><span class="ico">&#128200;</span><span>Progress</span></button>
  <button data-tab="plan"    class="tab"><span class="ico">&#128203;</span><span>Plan</span></button>
</nav>

<!-- Scanner overlay -->
<div class="overlay" id="scanOverlay" hidden>
  <div class="scan-head">
    <button class="btn ghost" id="scanClose">Close</button>
    <span id="scanStatus">Starting camera…</span>
  </div>
  <video id="scanVideo" playsinline muted></video>
  <div class="scan-reticle"></div>
  <div class="scan-foot">
    <input type="text" id="manualBarcode" inputmode="numeric" placeholder="Or type the barcode digits">
    <button class="btn" id="manualLookup">Look up</button>
  </div>
</div>

<!-- Generic modal -->
<div class="overlay sheet-overlay" id="sheet" hidden>
  <div class="sheet" id="sheetBody"></div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/nutrition.js"></script>
<script src="js/scanner.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.food.js"></script>
<script src="js/views.train.js"></script>
<script src="js/views.cardio.js"></script>
<script src="js/views.progress.js"></script>
<script src="js/views.plan.js"></script>
<script src="js/app.js"></script>
</body>
</html>
